name: Build Iris Gallery APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "IrisGallery-v4.8-source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          rm -rf source
          mkdir -p source
          unzip -q IrisGallery-v4.8-source.zip -d source

          echo "=== Extracted ==="
          find source -maxdepth 2 -type f | head -50

      - name: Find Android project
        id: project
        shell: bash
        run: |
          GRADLEW=$(find source -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Show Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version

          if [ -d "$ANDROID_HOME" ]; then
            echo "Android SDK found"
            ls "$ANDROID_HOME"
          else
            echo "ERROR: Android SDK not found"
            exit 1
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          echo "=== Searching APK ==="

          APK=$(find "${{ steps.project.outputs.dir }}" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find "${{ steps.project.outputs.dir }}" \
              -path "*/build/outputs/*" \
              -type f || true
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/IrisGallery-v2.1-debug.apk

          echo "=== BUILD SUCCESS ==="
          ls -lh output/IrisGallery-v2.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IrisGallery-v2.1-debug-apk
          path: output/IrisGallery-v2.1-debug.apk
          if-no-files-found: error
          retention-days: 30
